<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 860" width="1700" height="860" role="img" aria-label="Canada Career Coach: audit with AI, author it yourself">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29D3FC"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .file{fill:#0F1E2E;stroke:#29D3FC;stroke-opacity:.55;stroke-width:1.5}
      .region{fill:#1E1B2E;stroke:#FDED50;stroke-opacity:.7;stroke-width:1.5}
      .target{fill:#1A1A33;stroke:#A78BFA;stroke-opacity:.8;stroke-width:1.5}
      .line{stroke:#475569;stroke-width:1.5;fill:none}
    </style>
  </defs>

  <rect x="14" y="12" width="1676" height="836" rx="28" fill="url(#bg)"/>

  <!-- Left: identity -->
  <g transform="translate(96,118)">
    <rect x="0" y="0" width="56" height="70" rx="8" fill="none" stroke="url(#mark)" stroke-width="5"/>
    <path d="M14 22 H42 M14 34 H42 M14 46 H30" stroke="#29D3FC" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="62" r="17" fill="#0B1120" stroke="#4ADE80" stroke-width="5"/>
    <path d="M42 62 l6 6 l10 -12" fill="none" stroke="#4ADE80" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="190" y="176" class="sans" font-size="46" font-weight="600" fill="#F1F5F9">Canada Career Coach</text>

  <text x="98" y="300" class="mono" font-size="40" font-weight="700" fill="#F8FAFC">Audit with AI.</text>
  <text x="98" y="356" class="mono" font-size="40" font-weight="700" fill="#4ADE80">Author it yourself.</text>

  <text class="sans" font-size="21" fill="#CBD5E1">
    <tspan x="98" y="432">A job-application coach skill for Canadian roles.</tspan>
    <tspan x="98" y="466">It checks fit, keyword gaps and pay against your</tspan>
    <tspan x="98" y="500">real experience, and leaves the writing to you.</tspan>
  </text>

  <g class="sans" font-size="18" fill="#E2E8F0">
    <circle cx="106" cy="622" r="7" fill="#29D3FC"/><text x="122" y="628">Evidence-led</text>
    <circle cx="258" cy="622" r="7" fill="#4ADE80"/><text x="274" y="628">Private</text>
    <circle cx="358" cy="622" r="7" fill="#FC2898"/><text x="374" y="628">Canadian context</text>
    <circle cx="540" cy="622" r="7" fill="#FDED50"/><text x="556" y="628">Open source</text>
  </g>

  <text x="98" y="764" class="mono" font-size="18" fill="#64748B">v0.1.0 · adapted from UK Career Coach</text>

  <!-- Right: how it fits together -->
  <rect x="740" y="82" width="894" height="698" rx="22" fill="#0B1322" stroke="#1E293B" stroke-width="2"/>
  <circle cx="776" cy="118" r="7" fill="#FC2898"/>
  <circle cx="802" cy="118" r="7" fill="#FDED50"/>
  <circle cx="828" cy="118" r="7" fill="#4ADE80"/>
  <rect x="964" y="102" width="502" height="32" rx="16" fill="#131D33"/>
  <text x="1215" y="124" class="mono" font-size="16" fill="#94A3B8" text-anchor="middle">canada-career-coach</text>

  <g class="sans" font-size="15" fill="#94A3B8">
    <text x="774" y="188">Inside the folder</text>
    <text x="1150" y="188">Package</text>
    <text x="1322" y="188">Install in</text>
  </g>

  <!-- File boxes: y starts 206, step 88, height 66 -->
  <g class="mono" font-size="14" font-weight="700" fill="#F1F5F9">
    <rect class="file" x="774" y="206" width="266" height="66" rx="10"/>
    <text x="790" y="233">SKILL.md</text>
    <rect class="file" x="774" y="294" width="266" height="66" rx="10"/>
    <text x="790" y="321">profile-template.md</text>
    <rect class="file" x="774" y="382" width="266" height="66" rx="10"/>
    <text x="790" y="409">resume-versions-template.md</text>
    <rect class="file" x="774" y="470" width="266" height="66" rx="10"/>
    <text x="790" y="497">cover-letter-structure.md</text>
    <rect class="file" x="774" y="558" width="266" height="66" rx="10"/>
    <text x="790" y="585">keyword-library.md</text>
    <rect class="region" x="774" y="646" width="266" height="66" rx="10"/>
    <text x="790" y="673">alberta-calgary.md</text>
  </g>
  <g class="sans" font-size="14" fill="#94A3B8">
    <text x="790" y="256">Rules and workflows</text>
    <text x="790" y="344">Your facts; keep private</text>
    <text x="790" y="432">Defines your resume versions</text>
    <text x="790" y="520">Outline and prompts only</text>
    <text x="790" y="608">Keywords and ATS rules</text>
    <text x="790" y="696">Regional notes for Alberta</text>
  </g>

  <!-- Connectors to package -->
  <path class="line" d="M1040 239 H1072 M1040 327 H1072 M1040 415 H1072 M1040 503 H1072 M1040 591 H1072 M1040 679 H1072 M1072 239 V679 M1072 437 H1102"/>
  <path d="M1094 431 l8 6 l-8 6" fill="none" stroke="#475569" stroke-width="1.5"/>

  <rect x="1104" y="398" width="152" height="78" rx="12" fill="#162033" stroke="#64748B" stroke-width="1.5"/>
  <text x="1180" y="430" class="sans" font-size="17" font-weight="700" fill="#F1F5F9" text-anchor="middle">Skill folder</text>
  <text x="1180" y="455" class="sans" font-size="14" fill="#94A3B8" text-anchor="middle">zip for web</text>

  <!-- Connectors to targets -->
  <path class="line" d="M1256 437 H1290 M1290 340 V534 M1290 340 H1318 M1290 534 H1318"/>
  <path d="M1312 334 l8 6 l-8 6 M1312 528 l8 6 l-8 6" fill="none" stroke="#475569" stroke-width="1.5"/>

  <g class="sans">
    <rect class="target" x="1322" y="300" width="266" height="80" rx="12"/>
    <text x="1340" y="333" font-size="17" font-weight="700" fill="#F1F5F9">Claude.ai</text>
    <text x="1340" y="359" font-size="14" fill="#94A3B8">Upload the zip under Skills</text>
    <rect class="target" x="1322" y="494" width="266" height="80" rx="12"/>
    <text x="1340" y="527" font-size="17" font-weight="700" fill="#F1F5F9">Claude Code</text>
    <text x="1340" y="553" class="mono" font-size="14" fill="#94A3B8">Unzip into ~/.claude/skills/</text>
  </g>

  <text x="774" y="752" class="sans" font-size="14" fill="#64748B">Yellow outline = regional file; add one per province</text>
</svg>
